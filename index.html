<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DUNK">
<meta name="theme-color" content="#FF5C00">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>DUNK Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF5C00;
  --orange-dim: #c44600;
  --dark: #0a0a0a;
  --card: #141414;
  --card2: #1a1a1a;
  --card3: #222;
  --text: #e8e8e8;
  --muted: #666;
  --border: #242424;
  --green: #22c55e;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:var(--dark); color:var(--text); font-family:'DM Sans',sans-serif; }

/* ── LAYOUT ── */
#app { height:100dvh; display:flex; flex-direction:column; }
#screen { flex:1; overflow-y:auto; overflow-x:hidden; padding:0 0 calc(72px + var(--safe)); scroll-behavior:smooth; }
#screen::-webkit-scrollbar { display:none; }

/* ── BOTTOM NAV ── */
#nav {
  position:fixed; bottom:0; left:0; right:0;
  height:calc(60px + var(--safe));
  background:rgba(14,14,14,0.96);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex; align-items:flex-start; padding-top:8px;
  z-index:100;
}
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; padding:4px 0; }
.nav-icon { font-size:20px; transition:transform .2s; }
.nav-label { font-size:9px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); transition:color .2s; }
.nav-btn.active .nav-label { color:var(--orange); }
.nav-btn.active .nav-icon { transform:scale(1.15); }

/* ── PAGE HEADER ── */
.page-header {
  padding:52px 20px 16px;
  background: linear-gradient(180deg, #111 0%, var(--dark) 100%);
  position:sticky; top:0; z-index:50;
  border-bottom:1px solid var(--border);
}
.page-title { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:2px; color:#fff; line-height:1; }
.page-title span { color:var(--orange); }
.page-sub { font-size:12px; color:var(--muted); margin-top:3px; }

/* ── TODAY CARD ── */
.today-hero {
  margin:16px; border-radius:16px; overflow:hidden;
  background:linear-gradient(135deg, #1a1a1a 0%, #141414 100%);
  border:1px solid var(--border);
}
.today-top {
  padding:16px 18px 14px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.today-day { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; color:var(--orange); }
.today-date { font-size:11px; color:var(--muted); }
.today-badge { background:var(--orange); color:#fff; font-size:10px; font-weight:700; letter-spacing:1px; padding:4px 10px; border-radius:100px; text-transform:uppercase; }
.today-badge.rest { background:var(--card3); color:var(--muted); }
.today-body { padding:16px 18px; }
.today-session-name { font-family:'Bebas Neue',sans-serif; font-size:26px; color:#fff; letter-spacing:1px; margin-bottom:4px; }
.today-session-sub { font-size:12px; color:var(--muted); margin-bottom:14px; }
.today-progress { height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:6px; }
.today-progress-bar { height:100%; background:linear-gradient(90deg,var(--orange-dim),var(--orange)); border-radius:2px; transition:width .4s; }
.today-progress-label { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
.start-btn {
  width:100%; margin-top:14px;
  background:var(--orange); color:#fff;
  border:none; border-radius:12px;
  padding:14px; font-family:'Bebas Neue',sans-serif;
  font-size:18px; letter-spacing:2px; cursor:pointer;
  transition:opacity .2s, transform .1s;
}
.start-btn:active { transform:scale(.98); opacity:.85; }
.start-btn.done { background:var(--green); }

/* ── WEEK VIEW ── */
.week-strip {
  display:flex; gap:6px; padding:0 16px 16px;
  overflow-x:auto; scroll-snap-type:x mandatory;
}
.week-strip::-webkit-scrollbar { display:none; }
.week-day-chip {
  flex-shrink:0; scroll-snap-align:start;
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:10px 12px;
  text-align:center; min-width:70px; cursor:pointer;
  transition:border-color .2s;
}
.week-day-chip.today { border-color:var(--orange); }
.week-day-chip.done { border-color:var(--green); }
.wdc-day { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.wdc-num { font-family:'Bebas Neue',sans-serif; font-size:22px; color:#fff; line-height:1.1; }
.wdc-type { font-size:9px; color:var(--muted); margin-top:2px; line-height:1.3; }
.wdc-dot { width:6px; height:6px; border-radius:50%; margin:4px auto 0; }
.wdc-dot.orange { background:var(--orange); }
.wdc-dot.green { background:var(--green); }
.wdc-dot.empty { background:var(--border); }

/* ── SECTION ── */
.section { padding:0 16px 8px; }
.section-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#fff; margin-bottom:12px; }
.section-title span { color:var(--orange); }

/* ── CHECKLIST ── */
.checklist { display:flex; flex-direction:column; gap:8px; }
.check-item {
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px;
  display:flex; align-items:center; gap:12px;
  cursor:pointer; transition:border-color .2s, background .2s;
  user-select:none;
}
.check-item.checked { border-color:#1a3a1a; background:#0d1f0d; }
.check-box {
  width:22px; height:22px; border-radius:6px;
  border:2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; background:var(--card2);
}
.check-item.checked .check-box { background:var(--green); border-color:var(--green); }
.check-tick { color:#fff; font-size:13px; opacity:0; transition:opacity .2s; }
.check-item.checked .check-tick { opacity:1; }
.check-text { flex:1; }
.check-name { font-size:13px; font-weight:500; color:var(--text); transition:color .2s; }
.check-item.checked .check-name { color:var(--muted); text-decoration:line-through; }
.check-detail { font-size:11px; color:var(--muted); margin-top:2px; }
.check-sets { font-size:11px; color:var(--orange); font-weight:600; }

/* ── OBSERVATIONS ── */
.obs-card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:12px; }
.obs-header { padding:14px 16px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.obs-date { font-size:12px; font-weight:600; color:#fff; }
.obs-session { font-size:10px; color:var(--muted); background:var(--card2); padding:2px 8px; border-radius:4px; }
.obs-body { padding:12px 16px; font-size:13px; color:var(--muted); line-height:1.6; }
.obs-dunk { font-size:11px; margin-top:8px; color:var(--orange); font-weight:600; }
.delete-btn { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px; }

/* ── NEW OBS FORM ── */
.obs-form { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
.obs-form-title { font-size:13px; font-weight:600; color:#fff; margin-bottom:12px; }
.form-group { margin-bottom:10px; }
.form-label { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block; }
.form-textarea {
  width:100%; background:var(--card2); border:1px solid var(--border);
  border-radius:8px; padding:10px 12px; color:var(--text);
  font-family:'DM Sans',sans-serif; font-size:13px; resize:none;
  outline:none; transition:border-color .2s; line-height:1.5;
}
.form-textarea:focus { border-color:var(--orange); }
.form-input {
  width:100%; background:var(--card2); border:1px solid var(--border);
  border-radius:8px; padding:10px 12px; color:var(--text);
  font-family:'DM Sans',sans-serif; font-size:13px;
  outline:none; transition:border-color .2s;
}
.form-input:focus { border-color:var(--orange); }
.save-btn {
  width:100%; background:var(--orange); color:#fff; border:none;
  border-radius:10px; padding:12px; font-family:'Bebas Neue',sans-serif;
  font-size:16px; letter-spacing:2px; cursor:pointer;
  transition:opacity .2s;
}
.save-btn:active { opacity:.8; }

/* ── STATS ── */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 14px; }
.stat-val { font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--orange); line-height:1; }
.stat-label { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.4; }

/* ── PLANNING PAGE ── */
.planning-week { margin-bottom:16px; }
.pw-header { padding:12px 16px 8px; }
.pw-title { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
.pw-days { display:flex; flex-direction:column; gap:8px; padding:0 16px; }
.pw-day {
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px;
  display:flex; align-items:center; gap:12px;
}
.pw-day.rest { opacity:.5; }
.pw-day.done { border-color:#1a3a1a; }
.pw-day-num { font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--orange); min-width:28px; line-height:1; }
.pw-day-info { flex:1; }
.pw-day-name { font-size:13px; font-weight:600; color:#fff; }
.pw-day-sub { font-size:11px; color:var(--muted); margin-top:1px; }
.pw-day-badge { font-size:18px; }
.pw-day.done .pw-day-num { color:var(--green); }

/* ── SESSION MODAL ── */
#modal {
  position:fixed; inset:0; background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px); z-index:200;
  display:flex; flex-direction:column;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
#modal.open { opacity:1; pointer-events:all; }
.modal-inner {
  margin-top:auto; background:var(--dark); border-radius:24px 24px 0 0;
  border-top:1px solid var(--border);
  max-height:90dvh; overflow-y:auto; padding-bottom:calc(24px + var(--safe));
  transform:translateY(40px); transition:transform .3s;
}
#modal.open .modal-inner { transform:translateY(0); }
.modal-header { padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--dark); z-index:10; }
.modal-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:#fff; }
.modal-close { background:var(--card2); border:none; color:var(--text); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modal-body { padding:16px 20px; }
.modal-checklist { display:flex; flex-direction:column; gap:8px; }
.modal-done-btn {
  width:calc(100% - 40px); margin:16px 20px 0;
  background:var(--green); color:#fff; border:none;
  border-radius:14px; padding:16px;
  font-family:'Bebas Neue',sans-serif; font-size:20px;
  letter-spacing:2px; cursor:pointer;
}

  /* PROG BARS */
  .prog-grid{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px;}
  .prog-row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;}
  .prog-weeks{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--orange);min-width:60px;}
  .prog-bar-wrap{flex:1;height:3px;background:#222;border-radius:2px;overflow:hidden;}
  .prog-bar{height:100%;background:linear-gradient(90deg,var(--orange-dim),var(--orange));border-radius:2px;}
  .prog-desc{font-size:10px;color:var(--muted);flex:2;text-align:right;}
  /* PROGRAMME CARDS */
  .day-card{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;cursor:pointer;}
  .day-header{padding:12px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
  .day-num{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--orange);line-height:1;min-width:32px;}
  .day-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#fff;}
  .day-type{font-size:10px;color:var(--muted);margin-top:1px;}
  .day-badge{margin-left:auto;font-size:18px;}
  .day-body{padding:12px 14px;}
  .duration{font-size:9px;color:var(--orange);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:block;}
  .block{margin-bottom:10px;}
  .block-title{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .exercises{list-style:none;}
  .exercises li{font-size:11px;padding:5px 0;border-bottom:1px solid #1a1a1a;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:5px;line-height:1.4;}
  .exercises li:last-child{border-bottom:none;}
  .ex-name{color:var(--text);}
  .ex-sets{font-size:10px;color:var(--orange);font-weight:600;white-space:nowrap;}
  .ex-recup{font-size:9px;color:var(--muted);white-space:nowrap;background:var(--card3);padding:2px 6px;border-radius:4px;}

  .warning strong{color:var(--orange);}

  .nutri-hero{margin:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;}

  .macro-icon{font-size:18px;margin-bottom:5px;}
  .macro-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--orange);line-height:1;}
  .macro-label{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.4;}

  .tl-btn.active{background:var(--card3);border-color:#444;color:#fff;}
  .timeline{display:none;}

  .meal-line{width:1px;background:var(--border);flex:1;margin-top:5px;min-height:12px;}

  .meal-content{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;flex:1;margin-bottom:9px;margin-left:10px;}
  .meal-name{font-size:12px;font-weight:600;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .meal-badge{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:3px;}
  .badge-pre{background:rgba(59,130,246,0.15);color:var(--blue);border:1px solid rgba(59,130,246,0.3);}
  .badge-post{background:rgba(34,197,94,0.12);color:var(--green);border:1px solid rgba(34,197,94,0.25);}

  .meal-items{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
  .meal-item{background:var(--card2);border:1px solid var(--border);font-size:9px;color:var(--text);padding:2px 8px;border-radius:4px;}
  .meal-macros{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .mm{font-size:9px;color:var(--muted);}
  .mm span{color:var(--text);font-weight:600;}
  .tips-list{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px;}
  .tip-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px;}
  .tip-icon{font-size:20px;margin-bottom:7px;}
  .tip-title{font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
  .tip-text{font-size:11px;color:var(--muted);line-height:1.7;}
  .tip-text strong{color:var(--text);}

</style>
</head>

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(key) {
  const [y,m,d] = key.split('-');
  const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const months = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  const dt = new Date(parseInt(y), parseInt(m)-1, parseInt(d));
  return `${days[dt.getDay()]} ${parseInt(d)} ${months[parseInt(m)-1]}`;
}

function getWeekDays(offset=0) {
  const today = new Date();
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (day===0?6:day-1) + offset*7);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  });
}

function showPage(name, btn) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const s = document.getElementById('screen');
  if(name==='today') s.innerHTML = renderToday();
  else if(name==='planning') s.innerHTML = renderPlanning();
  else if(name==='programme') s.innerHTML = renderProgramme();
  else if(name==='nutrition') s.innerHTML = renderNutrition();
  else if(name==='obs') s.innerHTML = renderObs();
}

// ── TODAY ──
function renderToday() {
  const key = todayKey();
  const session = SCHEDULE[key];
  const isDone = state.done[key];
  const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const months = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const now = new Date();
  const dayName = days[now.getDay()];
  const dateStr = `${dayName} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

  // count done this week
  const weekDays = getWeekDays(0);
  const weekDone = weekDays.filter(d=>state.done[d]).length;
  const weekTotal = weekDays.filter(d=>SCHEDULE[d]).length;

  let todayBlock = '';
  if(session) {
    const allItems = (SESSIONS[session.type]?.blocks||[]).flatMap(b=>b.items);
    const checks = state.checks[key] || [];
    const checkedCount = checks.filter(Boolean).length;
    const pct = allItems.length ? Math.round(checkedCount/allItems.length*100) : 0;

    todayBlock = `
    <div class="today-hero">
      <div class="today-top">
        <div><div class="today-day">${dateStr}</div></div>
        <div class="today-badge${isDone?' done':''}">
          ${isDone ? '✓ Fait' : session.location}
        </div>
      </div>
      <div class="today-body">
        <div class="today-session-name">${session.icon} ${session.label}</div>
        <div class="today-session-sub">${SESSIONS[session.type]?.duration || ''} · ${session.location}${session.note ? ' · '+session.note : ''}</div>
        ${isDone ? '' : `
        <div class="today-progress">
          <div class="today-progress-bar" style="width:${pct}%"></div>
        </div>
        <div class="today-progress-label"><span>${checkedCount}/${allItems.length} exercices</span><span>${pct}%</span></div>
        `}
        <button class="start-btn${isDone?' done':''}" id="start-main-btn" onclick="handleStartBtn()">
          ${isDone ? '✓ SÉANCE VALIDÉE — ANNULER ?' : '▶ COMMENCER LA SÉANCE'}
        </button>
      </div>
    </div>`;
  } else {
    todayBlock = `
    <div class="today-hero">
      <div class="today-top">
        <div><div class="today-day">${dateStr}</div></div>
        <div class="today-badge rest">Repos</div>
      </div>
      <div class="today-body">
        <div class="today-session-name">😴 Pas de séance</div>
        <div class="today-session-sub">Récupération — profites-en pour bien manger et dormir 8h+</div>
      </div>
    </div>`;
  }

  // week strip
  const weekStrip = getWeekDays(0).map(d => {
    const dt = new Date(d);
    const dayLabels = ['D','L','M','M','J','V','S'];
    const lbl = dayLabels[dt.getDay()];
    const num = dt.getDate();
    const sess = SCHEDULE[d];
    const isToday = d===key;
    const isDoneD = state.done[d];
    return `<div class="week-day-chip${isToday?' today':''} ${isDoneD?' done':''}" data-k="${d}" onclick="if(SCHEDULE[this.dataset.k])openModal(this.dataset.k)">
      <div class="wdc-day">${lbl}</div>
      <div class="wdc-num">${num}</div>
      <div class="wdc-type">${sess ? sess.icon : '—'}</div>
      <div class="wdc-dot ${isDoneD?'green':sess?'orange':'empty'}"></div>
    </div>`;
  }).join('');

  return `
  <div class="page-header">
    <div class="page-title">BON<span>JOUR</span> 👋</div>
    <div class="page-sub">Objectif Dunk · ${Math.ceil((new Date('2026-08-02')-new Date())/86400000)} jours restants</div>
  </div>
  ${todayBlock}
  <div style="padding:0 0 8px"><div class="week-strip">${weekStrip}</div></div>

let planningWeekOffset = 0;
function renderPlanning() {
  const weeks = [];
  for(let w=0; w<9; w++) {
    const days = getWeekDays(w);
    const d0 = new Date(days[0]);
    const d6 = new Date(days[6]);
    const mths = ['jan','fév','mar','avr','mai','jun','jul','aoû'];
    const label = `${d0.getDate()} ${mths[d0.getMonth()]} → ${d6.getDate()} ${mths[d6.getMonth()]}`;
    const weekNum = w+1;
    const rows = days.map(d => {
      const dt = new Date(d);
      const dayNames = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
      const sess = SCHEDULE[d];
      const isDone = state.done[d];
      const isToday = d===todayKey();
      if(!sess) return `<div class="pw-day rest${isToday?' today':''}">
        <div class="pw-day-num" style="color:var(--muted)">${dt.getDate()}</div>
        <div class="pw-day-info"><div class="pw-day-name" style="color:var(--muted)">${dayNames[dt.getDay()]} — Repos</div></div>
        <div class="pw-day-badge">😴</div>
      </div>`;
      return `<div class="pw-day${isDone?' done':''}${isToday?' today':''}" data-k="${d}" onclick="openModal(this.dataset.k)">
        <div class="pw-day-num">${dt.getDate()}</div>
        <div class="pw-day-info">
          <div class="pw-day-name">${dayNames[dt.getDay()]} — ${sess.label}</div>
          <div class="pw-day-sub">${sess.location}${sess.note?' · '+sess.note:''}</div>
        </div>
        <div class="pw-day-badge">${isDone ? '✅' : sess.icon}</div>
      </div>`;
    }).join('');
    weeks.push(`
    <div class="planning-week">
      <div class="pw-header"><div class="pw-title">Semaine ${weekNum} · ${label}</div></div>
      <div class="pw-days">${rows}</div>
    </div>`);
  }
  return `
  <div class="page-header">
    <div class="page-title">PLAN<span>NING</span></div>
    <div class="page-sub">Adapté à ton emploi du temps · Appuie pour voir une séance</div>
  </div>
  ${weeks.join('')}`;
}

        <label class="form-label">🎯 Détente du jour (optionnel)</label>
        <input class="form-input" id="obs-dunk" placeholder="Ex: Touche la base de l'anneau / Paume dans le cercle...">
      </div>
      <button class="save-btn" onclick="saveObs()">ENREGISTRER</button>
    </div>
    ${cards}
  </div>`;
}

// ── PROGRAMME ──
function renderProgramme() {
  const daySessions = [
    {num:"LUN", name:"Force — Bas du corps", type:"force_bas", icon:"💪", loc:"Salle"},
    {num:"MAR", name:"Basket + Impulsion", type:"basket", icon:"🏀", loc:"Terrain"},
    {num:"MER", name:"Haut du corps A + Mobilité", type:"haut_a", icon:"🔝", loc:"Salle"},
    {num:"JEU", name:"Pliométrie + Explosivité", type:"plyo", icon:"⚡", loc:"Salle/Terrain"},
    {num:"VEN", name:"Basket + Tentatives Dunk", type:"basket_dunk", icon:"🎯", loc:"Terrain"},
    {num:"SAM", name:"Haut du corps B", type:"haut_b", icon:"💪", loc:"Salle"},
    {num:"DIM", name:"Piscine + Récupération", type:"piscine", icon:"🏊", loc:"Piscine"},
  ];
  const cards = daySessions.map(d => {
    const s = SESSIONS[d.type];
    const blocks = s.blocks.map(b => {
      const items = b.items.map(i => `<li><span class="ex-name">${i.name}</span><span class="ex-sets">${i.sets}</span><span class="ex-recup">${i.recup !== '—' ? '⏳ '+i.recup : '—'}</span></li>`).join('');
      return `<div class="block"><div class="block-title">${b.title}</div><ul class="exercises">${items}</ul></div>`;
    }).join('');
    return `<div class="day-card" onclick="openSessionType('${d.type}')">
      <div class="day-header"><div class="day-num">${d.num}</div><div class="day-info"><div class="day-name">${d.name}</div><div class="day-type">${d.loc}</div></div><div class="day-badge">${d.icon}</div></div>
      <div class="day-body"><span class="duration">⏱ ${s.duration}</span>${blocks}</div>
    </div>`;
  }).join('');

  const progRows = [
    {w:"S1–S2",pct:25,desc:"Adaptation — charges modérées, pliométrie légère, genou surveillé"},
    {w:"S3–S4",pct:50,desc:"Montée en charge — depth jumps, volumes augmentés"},
    {w:"S5–S6",pct:80,desc:"Phase intensive — pliométrie lourde, squat au max"},
    {w:"S7",pct:60,desc:"Affûtage — volume réduit, intensité maintenue"},
    {w:"S8",pct:90,desc:"Peak — corps frais, tentatives dunk chaque jour 🏀"},
  ].map(r => `<div class="prog-row"><div class="prog-weeks">${r.w}</div><div class="prog-bar-wrap"><div class="prog-bar" style="width:${r.pct}%"></div></div><div class="prog-desc">${r.desc}</div></div>`).join('');

  return `<div class="page-header"><div class="page-title">PRO<span>GRAMME</span></div><div class="page-sub">Type de séance · Temps de récup inclus</div></div>
  <div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:10px">${cards}</div>
  <div class="section"><div class="section-title">PLAN DE <span>PROGRESSION</span></div></div>
  <div class="prog-grid">${progRows}</div>`;
}

function openSessionType(type) {
  const sdata = SESSIONS[type];
  if(!sdata) return;
  currentModalKey = '__type__' + type;
  let idx = 0;
  document.getElementById('modal-title').textContent = sdata.icon + ' ' + sdata.name;
  let html = `<div style="font-size:11px;color:var(--muted);margin-bottom:14px">Séance type · ${sdata.duration}</div>`;
  sdata.blocks.forEach(block => {
    html += `<div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600;margin:12px 0 7px">${block.title}</div>`;
    block.items.forEach(item => {
      html += `<div class="check-item" style="cursor:default">
        <div class="check-text"><div class="check-name">${item.name}</div><div class="check-detail"><span class="check-sets">${item.sets}</span>${item.recup !== '—' ? ' · récup ' + item.recup : ''}</div></div>
      </div>`;
    });
  });
  document.getElementById('modal-body').innerHTML = html;
  document.querySelector('.modal-done-btn').style.display = 'none';
  document.getElementById('modal').classList.add('open');
}

      ${mealRow("20H","Dîner","Repas 5","key","Protéines lentes + légumes + lipides sains. Moins de glucides.","150g saumon/thon/œufs · Légumes variés · 100g patate douce · Avocat","Prot ~40g · Glucides ~45g · ≈ 520 kcal")}

    </div>

function switchTl(id, btn) {
  document.querySelectorAll('.timeline').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tl-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tl-' + id).classList.add('active');
  btn.classList.add('active');
}

// ═══════════════════════════════════════
// OBSERVATIONS
// ═══════════════════════════════════════
// OBSERVATIONS
// ═══════════════════════════════════════
function saveObs() {
  const text = document.getElementById('obs-text')?.value?.trim();
  const session = document.getElementById('obs-session')?.value?.trim();
  const dunkProgress = document.getElementById('obs-dunk')?.value?.trim();
  if(!text) { alert('Écris quelque chose !'); return; }
  state.obs.push({ date: formatDate(todayKey()), session: session||'—', text, dunkProgress });
  save();
  showPage('obs', document.querySelector('.nav-btn[data-page="obs"]'));
}

function deleteObs(i) {
  if(!confirm('Supprimer cette observation ?')) return;
  state.obs.splice(i,1);
  save();
  showPage('obs', document.querySelector('.nav-btn[data-page="obs"]'));
}


// ═══════════════════════════════════════
// MODAL
// ═══════════════════════════════════════
let currentModalKey = null;

function openModal(key) {
  document.querySelector('.modal-done-btn').style.display = '';
  const sess = SCHEDULE[key];
  if(!sess) return;
  const sdata = SESSIONS[sess.type];
  if(!sdata) return;
  currentModalKey = key;
  const checks = state.checks[key] || [];
  let idx = 0;
  document.getElementById('modal-title').textContent = sess.icon + ' ' + sdata.name;
  let html = '<div style="font-size:11px;color:var(--muted);margin-bottom:14px">' + formatDate(key) + ' · ' + sdata.duration + ' · ' + sess.location + '</div>';
  sdata.blocks.forEach(block => {
    html += '<div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600;margin:12px 0 7px">' + block.title + '</div>';
    block.items.forEach(item => {
      const i = idx++;
      const checked = checks[i];
      html += '<div class="check-item' + (checked ? ' checked' : '') + '" id="ci_' + i + '" onclick="toggleCheck(' + i + ')">' +
        '<div class="check-box"><span class="check-tick">✓</span></div>' +
        '<div class="check-text"><div class="check-name">' + item.name + '</div>' +
        '<div class="check-detail"><span class="check-sets">' + item.sets + '</span>' + (item.recup !== '—' ? ' · récup ' + item.recup : '') + '</div></div>' +
        '</div>';
    });
  });
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}

function openSessionType(type) {
  const sdata = SESSIONS[type];
  if(!sdata) return;
  currentModalKey = '__type__' + type;
  document.getElementById('modal-title').textContent = sdata.icon + ' ' + sdata.name;
  let html = '<div style="font-size:11px;color:var(--muted);margin-bottom:14px">Séance type · ' + sdata.duration + '</div>';
  sdata.blocks.forEach(block => {
    html += '<div style="font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600;margin:12px 0 7px">' + block.title + '</div>';
    block.items.forEach(item => {
      html += '<div class="check-item" style="cursor:default">' +
        '<div class="check-text"><div class="check-name">' + item.name + '</div>' +
        '<div class="check-detail"><span class="check-sets">' + item.sets + '</span>' + (item.recup !== '—' ? ' · récup ' + item.recup : '') + '</div></div>' +
        '</div>';
    });
  });
  document.getElementById('modal-body').innerHTML = html;
  document.querySelector('.modal-done-btn').style.display = 'none';
  document.getElementById('modal').classList.add('open');
}

function toggleCheck(i) {
  const key = currentModalKey;
  if(!state.checks[key]) state.checks[key] = [];
  state.checks[key][i] = !state.checks[key][i];
  save();
  const el = document.getElementById('ci_' + i);
  if(el) el.classList.toggle('checked', state.checks[key][i]);
  if(key === todayKey()) {
    const sess = SCHEDULE[key];
    const allItems = (SESSIONS[sess && sess.type] && SESSIONS[sess.type].blocks || []).flatMap(b => b.items);
    const checked = (state.checks[key] || []).filter(Boolean).length;
    const pct = allItems.length ? Math.round(checked / allItems.length * 100) : 0;
    const bar = document.getElementById('prog-bar');
    const lbl = document.getElementById('prog-lbl');
    if(bar) bar.style.width = pct + '%';
    if(lbl) lbl.innerHTML = '<span>' + checked + '/' + allItems.length + ' exercices</span><span>' + pct + '%</span>';
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  currentModalKey = null;
}

function finishSession() {
  if(!currentModalKey || currentModalKey.startsWith('__type__')) return;
  state.done[currentModalKey] = true;
  save();
  closeModal();
  showPage('today', document.querySelector('.nav-btn[data-page="today"]'));
}

function undoSession() {
  const key = todayKey();
  delete state.done[key];
  save();
  showPage('today', document.querySelector('.nav-btn[data-page="today"]'));
}

function handleStartBtn() {
  const key = todayKey();
  const isDone = state.done[key];
  if(isDone) { undoSession(); } else { openModal(key); }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
showPage('today', document.querySelector('.nav-btn[data-page="today"]'));

// close modal on backdrop click
document.getElementById('modal').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});
</script>
